name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /sjboutdoor
          # Google Analytics 4 measurement ID. Public by design (it's exposed in
          # the page source), so it's safe to keep here rather than in a secret.
          NEXT_PUBLIC_GA_ID: G-SST4SGWHN8
          # Staging host — makes IS_STAGING true so the GitHub Pages site emits
          # noindex + robots disallow and doesn't compete with the apex domain.
          # At cutover: change this to https://sjboutdoors.com (or remove it to
          # use the fallback in lib/site.ts) and the site becomes indexable.
          NEXT_PUBLIC_SITE_URL: https://mvoggel.github.io/sjboutdoor

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
