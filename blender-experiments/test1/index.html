<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motorized Shade — scroll test</title>
<style>
  html,body{margin:0;height:100%;background:#11100e;color:#e8e3d8;font:14px/1.5 system-ui,sans-serif}
  /* fixed canvas behind, tall spacer in front gives us something to scroll */
  #app{position:fixed;inset:0;z-index:0}
  #scroll{position:relative;z-index:1;height:300vh;pointer-events:none}
  #hud{position:fixed;top:16px;left:16px;z-index:2;background:rgba(0,0,0,.45);
       padding:10px 14px;border-radius:10px;backdrop-filter:blur(6px);pointer-events:none}
  #hud b{font-weight:600}
  .bar{width:160px;height:6px;background:#3a362e;border-radius:4px;margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:#c9a36a}
  .hint{opacity:.6;margin-top:6px;font-size:12px}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="scroll"></div>
  <div id="hud">
    <div><b>Shade</b>: <span id="state">open</span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="hint">scroll ↓ to close &nbsp;·&nbsp; drag to orbit</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  // ---- config you'll tweak as the model changes ----
  const MODEL_URL   = './shade_hero.glb';
  const PANEL_NAME  = 'Shade_Panel';
  const BAR_NAME    = 'Bottom_Bar';
  const OPEN = 0.02, CLOSED = 1.0;   // Shade_Panel local-Z scale endpoints
  const PANEL_DROP  = 2.66;          // metres of fabric travel (for bottom-bar follow)
  const DAMP = 0.12;                 // scroll smoothing

  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;   // film-like, ≈ the AgX grade in Blender
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14130f);

  // procedural environment = soft reflections without shipping an HDRI file
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  // warm low "late-afternoon" key + cool ambient, roughly matching the Blender setup
  const sun = new THREE.DirectionalLight(0xffd8a8, 2.6);
  sun.position.set(-4, 5, 4); sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004;
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xbcd0ff, 0x42382c, 0.35));

  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableZoom = false;   // let the wheel scroll the page (drives the shade)
  controls.enablePan  = false;
  controls.enableDamping = true;

  let panel = null, bar = null;

  new GLTFLoader().load(MODEL_URL, (gltf) => {
    // GLB was exported Z-up (so the animation axis stays unambiguous). Stand it up:
    const root = new THREE.Group();
    root.rotation.x = -Math.PI / 2;
    root.add(gltf.scene);
    scene.add(root);

    gltf.scene.traverse(o => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
      const n = (o.name || '').toLowerCase();
      if (n.includes('shade')) panel = o;
      if (n.includes('bottom') && n.includes('bar')) bar = o;
    });
    if (!panel) console.warn('Shade_Panel not found — check PANEL_NAME / export names');

    frameCamera(root);
  }, undefined, (e)=>console.error('GLB load failed:', e));

  function frameCamera(obj){
    const box = new THREE.Box3().setFromObject(obj);
    const c = box.getCenter(new THREE.Vector3());
    const s = box.getSize(new THREE.Vector3());
    const r = Math.max(s.x, s.y, s.z);
    camera.position.set(c.x - r*0.35, c.y + r*0.15, c.z + r*1.5);
    controls.target.copy(c);
    controls.update();
  }

  // ---- scroll → progress ----
  let target = OPEN, current = OPEN;
  function onScroll(){
    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
    target = THREE.MathUtils.lerp(OPEN, CLOSED, p);
    document.getElementById('fill').style.width = (p*100).toFixed(0) + '%';
    document.getElementById('state').textContent =
      p < 0.02 ? 'open' : p > 0.98 ? 'closed' : 'closing';
  }
  addEventListener('scroll', onScroll, { passive:true });
  onScroll();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.setAnimationLoop(()=>{
    current += (target - current) * DAMP;
    if (panel) panel.scale.z = current;                 // grows fabric down from its top-edge pivot
    if (bar)  bar.position.z = 0.10 - PANEL_DROP * current;  // bottom bar rides the fabric edge
    controls.update();
    renderer.render(scene, camera);
  });
  </script>
</body>
</html>
